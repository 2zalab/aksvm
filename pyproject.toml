[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aksvm"
version = "0.1.0"
description = "Associated-kernel support vector machines: PSD kernels from Beta, Gamma and discrete associated kernels"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Isaac Touza", email = "isaac.touza@univ-maroua.cm" },
  { name = "Wanbitching Eric Wansouwé" },
]
keywords = ["associated kernels", "support vector machines", "kernel methods",
            "mixed data", "nonparametric", "probability product kernels"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
test = ["pytest>=7"]
experiments = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/2zalab/aksvm"
Repository = "https://github.com/2zalab/aksvm"
Issues = "https://github.com/2zalab/aksvm/issues"

[tool.setuptools]
packages = ["aksvm"]
